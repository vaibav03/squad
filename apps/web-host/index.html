<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070f1f" />
    <title>Squad</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 10' shape-rendering='crispEdges'%3E%3Crect x='2' width='3' height='1' fill='%23b07a52'/%3E%3Crect x='1' y='1' width='5' height='1' fill='%236e4a3c'/%3E%3Crect x='1' y='2' width='5' height='5' fill='%23ffc857'/%3E%3Crect x='2' y='3' width='3' height='3' fill='%23fff0a8'/%3E%3Crect x='1' y='7' width='5' height='1' fill='%236e4a3c'/%3E%3C/svg%3E" />
    <script>
      // set the chrome theme and calm mode before first paint (no flash)
      try {
        var t = localStorage.getItem('squad.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('squad.calm') === '1') document.documentElement.dataset.calm = 'true';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
